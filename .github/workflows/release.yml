# Publishes a GitHub release: truenas_apps.zip, with release notes taken from that version's section of
# CHANGELOG.md. This is the copy the Marketplace installs and updates from.
# (.gitea/workflows/release.yml does the same on Gitea; both use the scripts in scripts/.)
#
# Two ways to start it:
#   - A version tag arriving here: Gitea's push mirror sends the tag after a release on Gitea, so each release
#     appears on both. (Pushing a tag here yourself works too: git tag v1.2.1 && git push origin v1.2.1.)
#   - Actions tab → Release → Run workflow, and enter the version (1.2.1). This also creates the tag (v1.2.1) on
#     the branch you run it from.
# It refuses to publish unless every version in the project and CHANGELOG.md agree with it and every check passes,
# so a release always matches the code in it. A version with a suffix (-beta) is a pre-release.
name: Release

on:
  push:
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 1.2.1)"
        required: true

permissions:
  contents: write # to create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Home Assistant 2026.9 runs on Python 3.14 and supports nothing older, so that's what the tests run on
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#[vV]}"  # (a "v" typed by mistake is fine)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the version and take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$GITHUB_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      - name: Install what the checks need
        run: pip install ruff

      - name: Lint and format (ruff)
        run: ruff check && ruff format --check

      - name: Run every test
        run: |
          # 30 simulated days (use 90 before a release: see CONTRIBUTING.md)
          python3 tests/test_integration.py 30
          python3 tests/test_release.py

      # The asset keeps the same name in every release: .../releases/latest/download/truenas_apps.zip relies on it.
      - name: Build truenas_apps.zip, and check it installs as custom_components/truenas_apps/
        run: python3 scripts/build_package.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand on GitHub: add the files and notes to it.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file notes.md \
              --target "$GITHUB_SHA" "${flags[@]}"
          fi
